function menu(){clearInterval(iv);G=null;jb=null;$('#top').innerHTML=$('#ctl').innerHTML=$('#cc').innerHTML='';$('#cc').style.display='none';$('#gl').className='';$('#nz').className='';bots.forEach(b=>{b.s=0;b.sd=b.side;place(b)});
ov(`<h1>5 NOITES<br>NO CASSINO</h1><p class="av">Você é o vigia da noite do cassino BetBoy. Rouge, Remy, Ray e Forest, os amigos do BetBoy, foram dominados pelo sistema de segurança. Sobreviva das 12h às 6h.</p><button class="btn big" data-a="go">${night>1?'CONTINUAR · NOITE '+night:'NOVA NOITE'}</button><button class="btn" data-a="how">COMO JOGAR</button>${night>1?'<button class="btn" data-a="reset">RECOMEÇAR</button>':''}<p class="av">Jogo fictício de suspense leve, sem sangue e sem dinheiro real. Apenas para maiores de 18 anos.</p>`)}
function how(){ov(`<h2>Como jogar</h2><p class="av" style="text-align:left">Fique no escritório até as 6h. Cada hora dura 45 segundos.<br><br><b>Olhar em volta:</b> mova o mouse para as laterais (ou arraste o dedo, ou use as setas).<br><br>Os quatro saem do palco, passam pelo salão e vêm pelos corredores. Os corredores são escuros: acenda a <b>luz</b> para ver quem está lá (olhos vermelhos!). A luz os assusta e faz recuar, e a <b>porta</b> fechada também. A luz vermelha em cima da porta pisca quando alguém está colado nela.<br><br>Tudo gasta <b>energia</b>: portas, luzes e câmeras. Se ela acabar, as portas abrem.<br><br>Rouge vem pela esquerda e Remy pela direita. Ray escolhe o lado. Forest congela quando você a observa nas câmeras.<br><br>Teclas: <b>A</b>/<b>D</b> portas · <b>Q</b>/<b>E</b> luzes · <b>Espaço</b> câmeras · <b>1-4</b> troca de câmera.</p><button class="btn big" data-a="menu">VOLTAR</button>`)}
function start(){$('#ov').style.display='none';jb=null;G={t:0,pw:100,dE:0,dD:0,lE:0,lD:0,cam:0,cr:0,over:0,out:0};bots.forEach(b=>{b.s=0;b.sd=b.side;place(b)});
$('#ctl').innerHTML='<button data-a="lE">Luz E</button><button data-a="dE">Porta E</button><button data-a="cam">Câmeras</button><button data-a="dD">Porta D</button><button data-a="lD">Luz D</button>';
clearInterval(iv);ui();iv=setInterval(tick,1000)}
const hr=()=>Math.floor(G.t/45),hrTxt=()=>(hr()||12)+' AM';
function ui(){const use=1+G.dE+G.dD+G.cam+G.lE+G.lD;
$('#top').innerHTML=`<span><b>${hrTxt()}</b> · Noite ${night}</span><span>Energia <b>${Math.ceil(G.pw)}%</b>${G.pw<=0?' · SEM ENERGIA':''}</span><span class="us">${'<i></i>'.repeat(Math.min(5,use))}</span>`;
document.querySelectorAll('#ctl button').forEach(b=>b.classList.toggle('act',!!G[b.dataset.a]));
const c=$('#cc');c.style.display=G.cam?'block':'none';c.innerHTML=G.cam?`<div class="cn"><i></i>CAM ${G.cr+1} · ${CN[G.cr]}</div><div class="cb">${CN.map((n,i)=>`<button data-r="${i}" class="${G.cr===i?'on':''}">${i+1}</button>`).join('')}</div>`:'';
$('#gl').className=G.cam?'cam':'';$('#nz').className=G.cam?'on':''}
function act(a){if(G.pw<=0)return;G[a]=G[a]?0:1;tone(a[0]==='d'?160:a==='cam'?420:300,.08);if(a[0]==='d'&&G[a])tone(90,.18,'square',.1);ui()}
const watched=b=>G.cam&&G.cr===(b.s<2?b.s:b.sd==='E'?2:3);
function move(b){if(b.s>=4)return;const a=b.a+night+hr()*.5;if(rnd(20)>=a)return;if(b.shy&&watched(b))return;
if(b.s===1&&!b.sd)b.sd=rnd(2)?'E':'D';
b.s++;if(b.s>=3)tone(60,.18,'sine',.14);if(b.s===4){b.hold=0;b.t4=0;b.lit=0}place(b)}
function react(b){const k=b.sd,lit=G['l'+k]&&G.pw>0;
if(b.s>=3&&lit){b.lit=(b.lit||0)+1;if(b.lit===1)tone(110,.25,'sawtooth',.08);
if(b.s===4&&b.lit>=3){b.s=3;b.lit=0;tone(80,.2,'sine',.14);place(b)}else if(b.s===3&&b.lit>=4){b.s=2;b.lit=0;place(b)}}else b.lit=0;
if(b.s===4){if(G['d'+k]){if(++b.hold>=2){b.s=1;b.sd=b.side;b.hold=0;tone(60,.3,'sawtooth',.2);place(b)}}else{b.hold=0;if(++b.t4>=6)scare(b)}}}
function tick(){if(G.over)return;G.t++;if(hr()>=6)return win();
const use=.08+G.dE*.14+G.dD*.14+G.cam*.1+G.lE*.1+G.lD*.1;
if(G.pw>0){G.pw=Math.max(0,G.pw-use);if(G.pw===0){G.dE=G.dD=G.lE=G.lD=G.cam=0;tone(60,.6,'sawtooth',.1)}}else if(++G.out>12)return scare(bots[rnd(4)]);
if(G.t%5===0)bots.forEach(b=>{if(!G.over)move(b)});bots.forEach(b=>{if(!G.over)react(b)});
if(!G.over)ui()}
function scare(b){if(G.over)return;G.over=1;clearInterval(iv);G.cam=0;ui();noise(.9);tone(90,.6,'sawtooth',.15);jb=b;jt=performance.now();ty=yaw=0;$('#gl').className='';
setTimeout(()=>ov(`<h2>Fim da noite</h2><p class="av">${b.n} pegou você às ${hrTxt()}.</p><button class="btn big" data-a="go">TENTAR DE NOVO</button><button class="btn" data-a="menu">MENU</button>`),1800)}
function win(){G.over=1;clearInterval(iv);tone(880,.3);setTimeout(()=>tone(1320,.4),250);
if(night>=5){night=1;sv();ov(`<h2>6 AM · Você venceu!</h2><p class="av">Cinco noites sobrevividas. O sol nasce, os amigos voltam ao normal e o cassino BetBoy abre as portas de novo.</p><button class="btn big" data-a="menu">MENU</button>`)}
else{ov(`<h2>6 AM</h2><p class="av">Você sobreviveu à noite ${night}. A próxima será mais difícil.</p><button class="btn big" data-a="go">PRÓXIMA NOITE</button><button class="btn" data-a="menu">MENU</button>`);night++;sv()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-r]');if(!b)return;au();
if(b.dataset.r){G.cr=+b.dataset.r;tone(500,.05);ui();return}
const a=b.dataset.a;if(a==='go')start();else if(a==='how')how();else if(a==='menu')menu();else if(a==='reset'){night=1;sv();menu()}else if(G&&!G.over)act(a)});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft')ty=cl(ty+.25,-1.45,1.45);if(k==='arrowright')ty=cl(ty-.25,-1.45,1.45);if(!G||G.over)return;
const m={a:'dE',d:'dD',q:'lE',e:'lD',' ':'cam',c:'cam'}[k];if(m){e.preventDefault();act(m)}else if(G.cam&&'1234'.includes(k)&&k.length===1){G.cr=+k-1;ui()}});
/* animação */
const nz=$('#nz').getContext('2d');let fr=0;
function frame(ms){requestAnimationFrame(frame);fr++;const t=ms/1000;
yaw+=(ty-yaw)*.1;CAM.rotation.y=yaw;CAM.position.y=1.25+Math.sin(t*1.3)*.012;
lamp.intensity=(G&&G.pw<=0)?(Math.random()<.5?0:.5):(1.15+Math.random()*.3);const cm=G&&G.cam&&!G.over;amb.intensity=cm?1.3:.3;CL.forEach(l=>l.intensity=cm?.6:0);
['E','D'].forEach(k=>{const on=G&&!G.over&&bots.some(b=>b.sd===k&&b.s===4);ALM[k].material.emissiveIntensity=on?(Math.sin(t*14)>0?3:.2):.15});
['E','D'].forEach(k=>{HL[k].intensity=G&&G['l'+k]&&G.pw>0?2.4*(.85+Math.random()*.3):0;const y=G&&G['d'+k]?1.15:3.5;DR[k].position.y+=(y-DR[k].position.y)*.15});
bl.rotation.z+=.35;
bots.forEach((b,i)=>{b.g.head.rotation.y=b.lit>0?Math.sin(t*40)*.05:Math.sin(t*1.5+i)*.25;b.g.head.rotation.z=Math.sin(t*2.2+i*2)*.06;b.g.eyes.emissiveIntensity=(b.lit>0?5:2)+Math.random()*1.5});
if(jb){const s=(ms-jt)/1000;jb.g.position.set((Math.random()-.5)*.12,-.5+(Math.random()-.5)*.1,Math.min(-.6,-3+s*10));jb.g.rotation.y=0;jb.g.head.rotation.z=Math.sin(s*70)*.25}
R.render(S,G&&G.cam&&!G.over?CC[G.cr]:CAM);
if(fr%3===0){const d=nz.createImageData(160,90);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=Math.random()*255;d.data[i+3]=45}nz.putImageData(d,0,0)}}
menu();requestAnimationFrame(frame);
</script></body></html>
